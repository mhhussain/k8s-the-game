ss nodes. No YAML. No terminal. Just menus."},{icon:"check",title:"Graded on the live cluster",body:"Mark a ticket done and the engine checks the real state. Resolve it, then break it, and the regression comes back for you."},{icon:"wifi_off",title:"Chaos that teaches",body:"Nodes go dark. Flash sales triple traffic. Bare Pods stay dead; Deployments heal. High availability is earned, not assumed."},{icon:"tree",title:"Automate the grind",body:"A 12-upgrade tech tree: CI, Rolling Updates, Dashboards, Affinity, Autoscaling, Auto-Rebalance. Make prod run itself."},{icon:"save",title:"Yours to keep",body:"Runs in any browser, no account, no server. Autosave, three slots, and JSON export to carry a run between machines."}],pr=[{src:Um,caption:"The ticket board: vague asks, concrete acceptance criteria."},{src:Lm,caption:"Infrastructure: nodes, pod slots, live health once you buy the dashboard."},{src:Mm,caption:"Author a service: replicas, workload type, placement. No YAML."},{src:Vm,caption:"The upgrade tree: automate your way out of the pager."}],sA={short:`${et} is a cozy-chaotic management sim where you run a production cluster with no terminal: work tickets, ship services, survive outages, automate everything.`,long:"You are the new architect of prod-east-1, and you start with one small node and an empty registry. Stakeholders file tickets in their own dialect (“it cannot blink”, “sale days get rough”), and every one of them is graded against the live state of your cluster. Build images, author services, spread replicas across nodes, tag hardware and keep the budget above water while flash sales spike traffic and nodes drop offline. Bare Pods die and stay dead; Deployments heal. Spend what you earn on a tech tree that automates the grind, from CI and rolling updates to autoscaling and self-healing, until the cluster finally runs itself. Everything happens in menus, forms and drag-and-drop. It runs entirely in your browser, with autosave and portable save files.",soc
