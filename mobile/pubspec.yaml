name: k8sthegame
description: An entirely offline Kubernetes management game.
publish_to: none
version: 1.0.0+2
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  file_selector: ^1.0.3
  share_plus: ^12.0.0
  audioplayers: ^6.5.1
  cross_file: ^0.3.5
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/audio/
    - assets/fonts/Roboto_LICENSE.txt
  fonts:
    - family: GameSans
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
